[opener]
imgopen = [{ run = "zen-browser %s", orphan = true, for = "unix" }]
edit = [{ run = "${EDITOR:-vi} %s", block = true, for = "unix" }]
fallback = [{ run = "xdg-open %s1", orphan = true, for = "unix" }]

[open]
rules = [
	{ mime = "image/*", use = "imgopen" },
	{ mime = "text/*", use = "edit" },
	{ url = "*", use = "fallback" },
]

[mgr]
show_hidden = true
