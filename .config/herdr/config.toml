onboarding = false
# herdr configuration — ported from ~/.config/tmux

[theme]
name = "rose-pine"

[terminal]
default_shell = "/bin/zsh"
new_cwd = "follow"  # tmux: split-window -c "#{pane_current_path}"

[session]
resume_agents_on_restore = true  # replaces resurrect + continuum

[ui]
mouse_capture = true
copy_on_select = true    # replaces tmux-yank
mouse_scroll_lines = 3   # replaces tmux-smooth-scroll

agent_panel_sort = "spaces"
[keys]
prefix = "ctrl+f"
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# splits: tmux `s` = stacked, `v` = side-by-side
split_vertical = "prefix+v"
split_horizontal = "prefix+s"

rename_tab = "prefix+r"      # tmux: prefix + r rename-window
resize_mode = "prefix+shift+r"
reload_config = "prefix+ctrl+r"

# pane nav (prefix + hjkl), zoom, close, tabs, goto: herdr defaults already match tmux

# ctrl+enter -> plain enter (herdr has no key remap; round-trip via the API)
[[keys.command]]
key = "ctrl+enter"
type = "shell"
command = 'herdr pane send-keys "$HERDR_ACTIVE_PANE_ID" enter'

[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "/bin/zsh"
width = "90%"
height = "90%"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"
description = "Vim-aware pane left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "local.vim-navigator.down"
description = "Vim-aware pane down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "local.vim-navigator.up"
description = "Vim-aware pane up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "local.vim-navigator.right"
description = "Vim-aware pane right"
